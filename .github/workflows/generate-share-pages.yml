name: Generate share pages

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/generate-share-pages.mjs'
      - '.github/workflows/generate-share-pages.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate per-match share pages
        env:
          SITE_URL: https://yblebon.github.io/ufc/
        run: node scripts/generate-share-pages.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/m
          if git diff --cached --quiet; then
            echo "No changes to share pages."
          else
            git commit -m "Regenerate per-match share pages"
            git push
          fi
